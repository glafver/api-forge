services:
  hpcdsystem:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-forge
    container_name: api-forge-app
    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RUNNING_IN_DOCKER: "true"
      DEV_KEY_SALT: ${DEV_KEY_SALT}
      ConnectionStrings__DefaultConnection: >
        Host=${DB_SERVER};Port=5432;Database=${DB_NAME};Username=${DB_ID};Password=${DB_PASSWORD}

    # Persist DataProtection keys so auth cookies survive container recreation
    volumes:
      - data-protection:/root/.aspnet/DataProtection-Keys

    depends_on:
      apiforge-postgres:
        condition: service_healthy

  apiforge-postgres:
    image: postgres:16-alpine
    container_name: apiforge-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ID}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ID} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgresdata:
  data-protection:
